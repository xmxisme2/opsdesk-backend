server:
  port: 8080

spring:
  application:
    name: opsdesk-backend
  datasource:
    # 本地开发数据库配置，生产环境后续改为环境变量或外部配置。
    url: jdbc:mysql://localhost:3306/opsdesk?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # Redis 首版用于验证码、token 黑名单、权限缓存和未读数。
      host: 127.0.0.1
      port: 6379
      timeout: 3s
  rabbitmq:
    host: ${AI_RABBITMQ_HOST:127.0.0.1}
    port: ${AI_RABBITMQ_PORT:5672}
    virtual-host: ${AI_RABBITMQ_VHOST:/opsdesk}
    username: ${AI_RABBITMQ_USERNAME:opsdesk_ai}
    password: ${AI_RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    # SMTP 参数仅从环境变量读取；未设置 MAIL_HOST 时不会创建邮件发送器，邮件通知会安全跳过。
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: false
  support-methods-arguments: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

opsdesk:
  logging:
    # 应用日志目录：默认相对后端工作目录，生产环境可通过 opsdesk.logging.path 覆盖。
    path: logs
  security:
    # JWT 密钥后续在认证模块落地时迁移到环境变量或安全配置中心。
    jwt-secret: dev-only-change-me
  storage:
    # 附件首版落盘到本地相对目录，接口不返回服务器绝对路径。
    file-root: storage/files
    # 用户自定义头像与业务附件隔离存储，并通过 /uploads/avatars/** 仅公开图片读取。
    avatar-root: storage/avatars
  # 邮件通知开关仅允许由本地部署配置控制；SMTP 凭据仍由 spring.mail 的 MAIL_* 环境变量读取。
  email-notification:
    enabled: false
  ai-service:
    # 独立 AI 服务仅允许主应用代理访问；共享密钥缺失时代理必须安全失败。
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8081}
    service-jwt-secret: ${AI_SERVICE_JWT_SECRET:}
    issuer: opsdesk-backend
    audience: opsdesk-ai-service
    token-ttl-seconds: 60
    connect-timeout-seconds: 3
    read-timeout-seconds: 10
  ai-events:
    # 阶段 2 本地联调时显式开启；密码缺失时保持关闭，不影响知识库事务。
    enabled: ${AI_EVENTS_ENABLED:false}
    dispatch-delay-ms: 1000
    batch-size: 50
  sms:
    # 短信能力开关：完成阿里云 SDK 与校验流程前保持关闭，避免配置密钥后误发短信。
    enabled: false
    aliyun-dypnsapi:
      # 号码认证服务地域与端点：当前按已提供的 ap-southeast-1 配置；SDK 接入时使用此地域创建客户端。
      region-id: ap-southeast-1
      endpoint: dypnsapi.aliyuncs.com
      # 凭据优先从环境变量读取；本地可改为直接填写，但真实密钥禁止提交到 Git。
      access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
      access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
      # 已提供的号码认证签名和验证码模板；上线前需在阿里云控制台确认二者处于可用绑定状态。
      sign-name: 恒创联众
      template-code: "100001"
      template-param: '{"code":"##code##","min":"5"}'
      country-code: "86"
      # 默认测试收件号码：仅用于本地联调，不得在业务接口中覆盖用户实际填写的手机号。
      test-phone-number: "15815327709"
      # 阿里云动态生成六码数字验证码，五分钟有效；同号码一分钟内不重复发送，重复时覆盖旧验证码。
      code-length: 6
      code-type: 1
      valid-time: 300
      interval: 60
      duplicate-policy: 1
      auto-retry: 1
      # 生产环境禁止返回验证码；验证码由后续 CheckSmsVerifyCode 接口进行校验。
      return-verify-code: false
